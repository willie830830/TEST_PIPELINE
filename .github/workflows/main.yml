name: List Org Repos (simple, no expressions)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq and gh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh

      - name: Determine organization (from this repo's owner)
        run: |
          ORG="${GITHUB_REPOSITORY%/*}"
          echo "ORG=$ORG" >> $GITHUB_ENV
          echo "Using org: $ORG"

      - name: Authenticate gh
        run: |
          set -e
          TOKEN="${ORG_TOKEN:-$GITHUB_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No token found in ORG_TOKEN or GITHUB_TOKEN." >&2
            exit 1
          fi
          echo "$TOKEN" | gh auth login --with-token

      - name: List repos (name + url)
        run: |
          set -e
          gh repo list "$ORG" --limit 1000 --json name,url,visibility,private > repos.json
          jq -r '["name","url"], (.[] | [.name, .url]) | @csv' repos.json > repos.csv
          COUNT=$(jq 'length' repos.json)
          {
            echo "### Repos in $ORG"
            echo "- Total: $COUNT"
            echo
            echo "<details><summary>Preview (first 20)</summary>"
            head -n 21 repos.csv | sed 's/^/- /'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: org-repos
          path: repos.csv
