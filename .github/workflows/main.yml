name: List Org Repos (Simple)

on:
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub Organization (e.g. your-org)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    env:
      ORG: ${{ inputs.org }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # PAT，含 read:org + repo
    steps:
      - name: Check token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERROR: Please add a PAT secret named ORG_TOKEN with scopes: read:org, repo" >&2
            exit 1
          fi

      - name: Ensure jq & gh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq gh
          gh --version

      - name: List repos (name + url)
        run: |
          # 抓全 org（含私有，取決於 PAT 權限）
          gh repo list "$ORG" --limit 1000 --json name,url \
            | jq -r '.[] | {name, url}' > repos.json

          # 產生 CSV（含表頭）
          jq -r '["name","url"], (.[] | [.name, .url]) | @csv' repos.json > repos.csv

          # 顯示統計與前幾筆預覽到摘要
          COUNT=$(jq 'length' repos.json)
          {
            echo "### Repositories in \`$ORG\`"
            echo "- Total: **$COUNT**"
            echo
            echo "<details><summary>Preview (first 20)</summary>"
            head -n 21 repos.csv | sed 's/^/- /'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: org-repos
          path: repos.csv
